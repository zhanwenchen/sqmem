[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sq_mem_experiments"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
scienceworld = [
    "scienceworld>=1.1",
]
alfworld = [
    "alfworld>=0.3",
]
local_llm = [
    "openai>=1.0",
]
sentence_transformers = [
    "sentence-transformers>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sq_mem_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parallel: integration tests for episode-level multiprocessing (live JVM required; skipped by default)",
]
