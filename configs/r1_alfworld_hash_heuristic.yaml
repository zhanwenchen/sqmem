# r1 — ALFWorld pipeline validation (hash embedder, heuristic base policy)
#
# Mirrors configs/r1_scienceworld_hash_heuristic.yaml but on ALFWorld.
# Validates that all 16 variants run end-to-end, split discipline holds,
# and Q-distributions / interventions behave as theory predicts.
#
# Requires ALFWorld data on disk; set $ALFWORLD_DATA or benchmark.data_root.

run_id: r1_alfworld_hash_heuristic

benchmark:
  name: alfworld
  data_root: ${ALFWORLD_DATA}        # or hard-code an absolute path
  train_split: train                  # 6 task types covered by ALFWorld's train split
  test_split: valid_unseen            # OOD split (held-out scene + task combos)
  n_train: 15
  n_test: 15
  max_steps: 50                       # ALFWorld gold paths are 10–25 steps; 50 gives ~2–5× slack, matching SW's 4× of its 5-step path
  reward_mode: score_delta
  success_threshold: 0.9

memory_builder:
  # Use self_rollout instead of gold_and_random: ALFWorld's gold-path source
  # is the handcoded expert wrapper, which has an upstream bug
  # (handcoded_expert.py:268-270, substring-vs-class-match disagreement).
  # self_rollout rolls out the heuristic base policy on training tasks; the
  # downstream returns observed in those rollouts label the memory rows. No
  # LLM needed — the heuristic policy is the same one used in test variants.
  agent: self_rollout
  n_rollouts_per_task: 3
  epsilon: 0.3

memory:
  embedder: hash
  vocab_size: 4096
  dim: 64
  top_r: 10
  alpha: 0.5
  beta: 0.1

agent:
  lambda_memory: 1.0
  rho_uncertainty: 0.5
  epsilon: 0.1
  # llm.enabled: false (default) — pure heuristic base policy

variants:
  - raw_history
  - summary_memory
  - semantic_retrieval
  - state_only_value_memory
  - raw_prefix_sq_mem
  - sq_mem
  - sq_mem_no_returns
  - sq_mem_no_action_conditioning
  - sq_mem_no_structured_state
  - sq_mem_no_uncertainty
  - sq_mem_top1
  - sq_mem_uniform_weights
  - sq_mem_random_memory
  - sq_mem_shuffled_returns
  - sq_mem_value_reversed
  - sq_mem_zero_returns

hypothesis_tests:
  min_success_delta: 0.02
  min_calibration_spearman: 0.30
  min_intervention_episode_rate: 0.01
  bootstrap_samples: 1000
  min_bootstrap_pairs: 5
