run_id: scienceworld_smoke

benchmark:
  name: scienceworld
  task_names:
    - boil
    - melt
    - use-thermometer
  train_variations: [0, 1, 2, 3, 4]
  test_variations: [20, 21, 22, 23, 24]
  max_steps: 30
  reward_mode: score_delta
  success_threshold: 0.9

memory_builder:
  agent: scienceworld_gold_and_random
  random_episodes_per_task: 3   # low heuristic_prob → mostly random → low returns
  heuristic_prob: 0.2

memory:
  embedder: sentence_transformers
  st_model: all-MiniLM-L6-v2    # 22 MB, downloads once on first run
  top_r: 10
  alpha: 0.5
  beta: 0.1

agent:
  lambda_memory: 3.0    # raised: memory needs to overcome LLM's 1.0 vs 0.05 base-score gap
  rho_uncertainty: 0.5
  llm:
    enabled: true
    provider: local
    url: http://localhost:8080/v1
    model: local-model
    max_candidates: 20

variants:
  - raw_history
  - summary_memory
  - semantic_retrieval
  - sq_mem
  - sq_mem_no_returns
  - sq_mem_shuffled_returns
  - sq_mem_value_reversed
  - sq_mem_zero_returns

hypothesis_tests:
  min_success_delta: 0.02
  min_error_recovery_delta: 0.02
  min_calibration_spearman: 0.30
  min_intervention_episode_rate: 0.01
  bootstrap_samples: 1000
  min_bootstrap_pairs: 5
  require_positive_ci_when_available: false
