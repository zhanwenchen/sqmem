# r4 ALFWorld — Flag C: q_in_prompt (LLM consumes per-action Q/σ in prompt)
#
# Builds on r3_alfworld_st_llm.yaml. Identical except q_in_prompt: true.
# When q_in_prompt is true, the runner:
#   - computes Q̂(s,a) and σ̂(s,a) exactly as Section 2 of paper.md prescribes
#   - formats them as "[memory Q=…, σ=…]" annotations next to each candidate action
#   - skips the Section 3 arithmetic combine — the LLM is the decider
#
# Hypothesis being tested: on ALFWorld, where the r3 result showed
# memory_q is ANTI-correlated with success (Spearman ρ = -0.667), the
# LLM consuming numeric Q/σ values should outperform the arithmetic
# combine — because the LLM can choose to ignore memory when σ is high
# (which it will be, on cross-room states), while the linear combine
# applies λ·Q − ρ·σ uniformly.

run_id: r4_alfworld_q_in_prompt

benchmark:
  name: alfworld
  data_root: ${ALFWORLD_DATA}
  train_split: train
  test_split: valid_unseen
  n_train: 15
  n_test: 15
  max_steps: 50
  reward_mode: score_delta
  success_threshold: 0.9

memory_builder:
  agent: self_rollout
  n_rollouts_per_task: 20
  epsilon: 0.3

memory:
  embedder: sentence_transformers
  st_model: all-MiniLM-L6-v2
  top_r: 10
  alpha: 0.5
  beta: 0.1

agent:
  lambda_memory: 3.0
  rho_uncertainty: 0.5
  epsilon: 0.1
  memory_mode: q_rerank
  normalize_actions: true
  q_in_prompt: true               # ← Flag C
  llm:
    enabled: true
    provider: local
    url: http://localhost:8080/v1
    model: local-model
    max_candidates: 20

variants:
  - raw_history
  - summary_memory
  - semantic_retrieval
  - state_only_value_memory
  - raw_prefix_sq_mem
  - sq_mem
  - sq_mem_no_returns
  - sq_mem_no_action_conditioning
  - sq_mem_no_structured_state
  - sq_mem_no_uncertainty
  - sq_mem_top1
  - sq_mem_uniform_weights
  - sq_mem_random_memory
  - sq_mem_shuffled_returns
  - sq_mem_value_reversed
  - sq_mem_zero_returns

hypothesis_tests:
  min_success_delta: 0.02
  min_calibration_spearman: 0.30
  min_intervention_episode_rate: 0.01
  bootstrap_samples: 1000
  min_bootstrap_pairs: 5
